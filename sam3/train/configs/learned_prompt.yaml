# python -m sam3.train.learned_prompt --config sam3/train/configs/learned_prompt.yaml
checkpoint: /path/to/sam3.pt
initial_feature: /path/to/right_hand_initial.pt
target_id: right_hand
kind: hand_right
category_id: 1
output_dir: outputs/learned_right_hand
dataset_root: ~/Datasets/uni-hoi-dataset
device: cuda:0
epochs: 20
batch_size: 1
num_workers: 0
lr: 0.001
max_grad_norm: 1.0
amp: true
seed: 0
train:
  split: train
# Set val: null only if no held-out annotations are available.
val:
  split: val
loss:
  mask: 20.0
  dice: 1.0
  box: 5.0
  giou: 2.0
  classification: 20.0
  presence: 20.0
