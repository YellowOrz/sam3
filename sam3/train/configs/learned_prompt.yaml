# python -m sam3.train.learned_prompt --config sam3/train/configs/learned_prompt.yaml
checkpoint: /data0/xuzhefeng/.cache/modelscope/models/facebook--sam3/snapshots/master/sam3.pt
initial_feature: /data0/xuzhefeng/Datasets/uni-hoi-dataset/right_hand_initial.pt
target_id: right_hand
kind: hand_right
category_id: 1
output_dir: outputs/learned_right_hand
dataset_root: /data0/xuzhefeng/Datasets/uni-hoi-dataset
# Physical GPU ids. One id is single-process; several ids spawn DDP.
device: cuda:1,2,3
epochs: 20
# Keep numbered resumable snapshots every N epochs; 0 disables snapshots.
# last.pt / learned_prompt.pt still update every epoch; best.pt tracks validation.
save_every_n_epochs: 5
batch_size: 8
num_workers: 16
lr: 0.0003
max_grad_norm: 1.0
amp: true
seed: 0
tensorboard_interval: 100
# Log RGB / GT overlay / prediction overlay on epochs n, 2n, ...
val_visualization_interval: 1
# Fixed first N validation images; 0 disables visualization.
val_visualization_max_images: 8
val_visualization_threshold: 0.5
train:
  split: train
# Set val: null only if no held-out annotations are available.
val:
  split: val
loss:
  mask: 20.0
  dice: 1.0
  box: 5.0
  giou: 2.0
  classification: 20.0
  presence: 20.0
